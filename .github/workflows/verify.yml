name: Verify app and quality workflow
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix app
      - run: npm test --prefix app
      - run: npm run lint --prefix app
      - run: npm run build --prefix app
      - run: python -m pip install numpy -r cloud_dbh/requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s analytics/tests
      - run: python -m unittest discover -s cloud_dbh
